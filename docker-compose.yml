version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jwt-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # IMPORTANT: Set SECRET_KEY to a strong random value before deploying to production.
      # Example: generate with `openssl rand -hex 32`
      # - SECRET_KEY=replace-with-a-strong-random-secret
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
